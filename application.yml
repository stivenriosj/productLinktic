server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://db:5432/products_db
    username: postgres
    password: test1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
flyway:
  enabled: true
  locations: classpath:db/migration
security:
  api-key: ${PRODUCTS_API_KEY:prod-secret}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
